upstream frontend_upstream {
  server frontend:3000;
}

upstream backend_upstream {
  server backend:4000;
}

upstream ghost_upstream {
  server ghost:2368;
}

upstream ghost_cms_upstream {
  server ghost-cms:2368;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_authorization $ghost_api_authorization {
  default $http_authorization;
  "~*^Basic\\s+" "";
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ghost_login_limit:10m rate=5r/m;

server {
  listen 80;
  server_name zeitgeist.host www.zeitgeist.host api.zeitgeist.host;

  client_max_body_size 50m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location ~ /\.(?!well-known) {
    return 404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name zeitgeist.host www.zeitgeist.host;

  client_max_body_size 50m;

  ssl_certificate /etc/letsencrypt/live/zeitgeist.host/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zeitgeist.host/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ /\.(?!well-known) {
    return 404;
  }

  location /_next/static/ {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /ghost/api/admin/session {
    limit_req zone=ghost_login_limit burst=10 nodelay;
    auth_basic off;
    proxy_pass http://ghost_cms_upstream/ghost/api/admin/session/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $ghost_api_authorization;
  }

  location = /ghost/api/admin/session/ {
    limit_req zone=ghost_login_limit burst=10 nodelay;
    auth_basic off;
    proxy_pass http://ghost_cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $ghost_api_authorization;
  }

  location ^~ /ghost/api/ {
    auth_basic off;
    proxy_pass http://ghost_cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $ghost_api_authorization;
  }

  location = /ghost/ghost {
    return 302 /ghost/;
  }

  location = /ghost/ghost/ {
    return 302 /ghost/;
  }

  location ^~ /ghost/ {
    auth_basic "restricted";
    auth_basic_user_file /etc/nginx/.ghost_basic_auth.htpasswd;
    client_max_body_size 25m;
    add_header x-frame-options "SAMEORIGIN" always;
    add_header x-content-type-options "nosniff" always;
    add_header referrer-policy "strict-origin-when-cross-origin" always;
    add_header permissions-policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://ghost_cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ^~ /content/ {
    add_header x-frame-options "SAMEORIGIN" always;
    add_header x-content-type-options "nosniff" always;
    add_header referrer-policy "strict-origin-when-cross-origin" always;
    add_header permissions-policy "geolocation=(), microphone=(), camera=()" always;
    proxy_pass http://ghost_cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ^~ /members/ {
    proxy_pass http://ghost_cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.zeitgeist.host;

  client_max_body_size 50m;

  ssl_certificate /etc/letsencrypt/live/zeitgeist.host/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zeitgeist.host/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ /\.(?!well-known) {
    return 404;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    proxy_pass http://ghost_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
