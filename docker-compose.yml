services:
  postgres:
    image: postgres:16-alpine
    container_name: zeitgeist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-zeitgeist}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-zeitgeist_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      GHOST_DB: ${GHOST_DB:-ghost}
      GHOST_DB_USER: ${GHOST_DB_USER:-ghost}
      GHOST_DB_PASSWORD: ${GHOST_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: zeitgeist-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - internal

  minio-init:
    image: minio/mc:latest
    container_name: zeitgeist-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-zeitgeist}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\"; do sleep 2; done;
      mc mb --ignore-existing local/$S3_BUCKET;
      mc anonymous set none local/$S3_BUCKET;
      "
    restart: "no"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeitgeist-backend
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: ops/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api.zeitgeist.host}
        GHOST_CONTENT_API_URL: ${GHOST_CONTENT_API_URL:-}
        GHOST_CONTENT_API_KEY: ${GHOST_CONTENT_API_KEY:-}
        GHOST_REVALIDATE_SECONDS: ${GHOST_REVALIDATE_SECONDS:-120}
    container_name: zeitgeist-frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api.zeitgeist.host}
      GHOST_CONTENT_API_URL: ${GHOST_CONTENT_API_URL:-}
      GHOST_CONTENT_API_KEY: ${GHOST_CONTENT_API_KEY:-}
      GHOST_REVALIDATE_SECONDS: ${GHOST_REVALIDATE_SECONDS:-120}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  ghost:
    image: ghost:5-alpine
    container_name: zeitgeist-ghost
    environment:
      NODE_ENV: production
      url: https://api.zeitgeist.host/ghost
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
    volumes:
      - ghost_content:/var/lib/ghost/content
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:2368/').then((r)=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: zeitgeist-nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ghost:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certbot/www:/var/www/certbot:ro
      - ./ops/certbot/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    container_name: zeitgeist-certbot
    profiles:
      - certbot
    volumes:
      - ./ops/certbot/www:/var/www/certbot
      - ./ops/certbot/letsencrypt:/etc/letsencrypt
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  ghost_content:
