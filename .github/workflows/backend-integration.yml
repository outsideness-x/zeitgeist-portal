name: backend integration

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeitgeist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zeitgeist_test
      NODE_ENV: test
      BACKEND_HOST: 127.0.0.1
      BACKEND_PORT: 4001
      BACKEND_COOKIE_SECRET: test-cookie-secret-value-with-enough-length
      BACKEND_CORS_ORIGIN: http://localhost:3000
      SESSION_TTL_HOURS: 4
      CSRF_HEADER_NAME: x-csrf-token
      CONTENT_PROVIDER: local
      PUBLISH_PROVIDER: local
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: zeitgeist
      S3_SIGNED_URL_EXPIRES_SECONDS: 300
      UPLOAD_MAX_BYTES: 26214400
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_WINDOW_SECONDS: 60
      ANALYTICS_COOKIE_MAX_AGE_DAYS: 365
      MAX_APPLAUSE_PER_USER_PER_ARTICLE: 50

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: install backend dependencies
        run: npm install --no-audit --no-fund

      - name: prisma generate
        run: npm run prisma:generate

      - name: prisma migrate deploy
        run: npm run prisma:deploy

      - name: run integration tests
        run: npm run test:integration
